services:
  ideen-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=${BASE_URL}
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    networks:
      - ideen-net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.ideen-backend.rule=Host(`ideen.mopilot.website`) && PathPrefix(`/api`)"
      - "traefik.http.routers.ideen-backend.tls=true"
      - "traefik.http.routers.ideen-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ideen-backend.priority=20"
      - "traefik.http.services.ideen-backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ideen-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://ideen-backend:8000
    networks:
      - ideen-net
      - coolify
    depends_on:
      ideen-backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.ideen-frontend.rule=Host(`ideen.mopilot.website`)"
      - "traefik.http.routers.ideen-frontend.tls=true"
      - "traefik.http.routers.ideen-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ideen-frontend.priority=10"
      - "traefik.http.services.ideen-frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  uploads:

networks:
  ideen-net:
    driver: bridge
  coolify:
    external: true
